name: add-large-asset
on:
  push:
    paths: ['.github/workflows/add-large-asset.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the one file too large for the upload path, verify, commit
        run: |
          set -e
          if [ -f assets/new/keytruda-qlex-one-minute.mp4 ]; then echo "already present"; exit 0; fi
          curl -fsSL -o assets/new/keytruda-qlex-one-minute.mp4 https://dmomanaee.sites.tab.bot/assets/new/keytruda-qlex-one-minute.mp4
          echo "8426163bdf15fefff9d7335f382667f2e6443045674a80629629dd9ce88ac600  assets/new/keytruda-qlex-one-minute.mp4" | sha256sum -c -
          git config user.name "electricdee"
          git config user.email "347053397+electricdee@users.noreply.github.com"
          git add assets/new/keytruda-qlex-one-minute.mp4
          git commit -m "Add keytruda-qlex-one-minute.mp4"
          git push
